services:
  app:
    build: .
    ports:
      - "0.0.0.0:8081:8080"
    environment:
      DATABASE_URL: postgresql://ctfapp:ctfapp_dev_only@db:5432/ctf_lab
      FLASK_SECRET_KEY: local-training-key-change-me
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ctf_lab
      POSTGRES_USER: ctfapp
      POSTGRES_PASSWORD: ctfapp_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfapp -d ctf_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
