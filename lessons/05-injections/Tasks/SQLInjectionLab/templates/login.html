<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTF Lab — Вход</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101820; color: #e9f3f7; font: 16px/1.45 Arial, sans-serif; }
    .panel { width: min(100%, 440px); padding: 34px; border: 1px solid #2f495b; border-radius: 14px; background: #182733; box-shadow: 0 18px 48px #0008; }
    .eyebrow { margin: 0 0 8px; color: #53c7e8; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font-size: 1.75rem; }
    .lead { margin: 0 0 26px; color: #b7cbd5; }
    label { display: block; margin: 16px 0 7px; font-weight: 700; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #406074; border-radius: 8px; background: #101820; color: inherit; font: inherit; }
    input:focus { outline: 2px solid #53c7e8; outline-offset: 1px; }
    button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 8px; background: #53c7e8; color: #10212b; cursor: pointer; font: 700 1rem Arial, sans-serif; }
    button:hover { background: #8bdcf1; }
    .error { margin: 0 0 16px; padding: 10px 12px; border-left: 3px solid #ef7d7d; border-radius: 4px; background: #3a2429; color: #ffd9d9; }
    .hint { margin: 22px 0 0; color: #91aab7; font-size: .88rem; }
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">CTF · SQL Injection Lab</p>
    <h1>Вход в личный кабинет</h1>
    <p class="lead">Учебный сервис факультатива по безопасности.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}" autocomplete="off">
      <label for="login">Логин</label>
      <input id="login" name="login" required autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Войти</button>
    </form>
    <p class="hint">Стенд запускается только для изолированной практики.</p>
  </main>
</body>
</html>
