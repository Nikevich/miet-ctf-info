<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTF Lab — Профиль</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 24px; background: #101820; color: #e9f3f7; font: 16px/1.5 Arial, sans-serif; }
    main { width: min(100%, 720px); margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 5px; color: #53c7e8; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 1.8rem; }
    .panel { padding: 28px; border: 1px solid #2f495b; border-radius: 14px; background: #182733; box-shadow: 0 18px 48px #0008; }
    dt { margin-top: 18px; color: #91aab7; font-size: .85rem; font-weight: 700; text-transform: uppercase; }
    dd { margin: 4px 0 0; font-size: 1.12rem; }
    code { display: inline-block; padding: 8px 10px; border-radius: 7px; background: #101820; color: #8bdcf1; overflow-wrap: anywhere; }
    button { padding: 10px 14px; border: 1px solid #406074; border-radius: 8px; background: transparent; color: #e9f3f7; cursor: pointer; font: 700 .9rem Arial, sans-serif; }
    button:hover { border-color: #53c7e8; color: #53c7e8; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <p class="eyebrow">CTF · SQL Injection Lab</p>
        <h1>Личный кабинет</h1>
      </div>
      <form method="post" action="{{ url_for('logout') }}"><button type="submit">Выйти</button></form>
    </div>
    <section class="panel">
      <dl>
        <dt>Пользователь</dt>
        <dd>{{ user.display_name }} ({{ user.login }})</dd>
        <dt>Закрытая заметка</dt>
        <dd><code>{{ user.private_note }}</code></dd>
      </dl>
    </section>
  </main>
</body>
</html>
